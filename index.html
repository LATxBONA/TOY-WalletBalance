<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wallet Balance - Kết hợp Chia đều & Tính riêng</title>

  <!-- Tích hợp Font chữ hiện đại từ Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Liên kết tới file style.css -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- Khối nền trang trí Ambient Blobs -->
  <div class="bg-decor">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="page-container">
    <header class="page-header">
      <h1>✨ Wallet Balance — Hỗ trợ Chia tiền</h1>
      <button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span>
        <span id="theme-label">Chế độ tối</span>
      </button>
    </header>

    <div class="card">
      <div class="form-grid">
        <div>
          <label>📅 Ngày</label>
          <input type="date" id="date">
        </div>
        <div>
          <label>🏷️ Tên khoản / Buổi</label>
          <input type="text" id="title" placeholder="Ví dụ: Xem phim, Ăn lẩu...">
        </div>
        <div>
          <label>💳 Người trả</label>
          <input type="text" id="payer" placeholder="Tên người trả">
        </div>
      </div>

      <div class="form-grid-second">
        <div>
          <label>⚡ Kiểu chia</label>
          <select id="split-type" onchange="toggleSplitType()">
            <option value="equal">Chia đều (group)</option>
            <option value="individual">Tính riêng (mỗi món)</option>
          </select>
        </div>

        <div>
          <label id="lbl-either">⚙️ Tùy chọn chi tiết</label>
          <div id="equal-section">
            <input type="number" id="amount" placeholder="Tổng tiền (đ)">
            <input type="text" id="participants" placeholder="Người tham gia (cách nhau dấu phẩy)" style="margin-top: 8px;">
          </div>

          <div id="individual-section" class="hidden">
            <div id="individual-list"></div>
            <button type="button" onclick="addIndividualRow()" class="small ghost" style="margin-top: 4px;">+ Thêm dòng món</button>
          </div>
        </div>

        <div>
          <label style="opacity:0">action</label>
          <button onclick="addExpense()" style="width:100%">➕ Thêm chi phí</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📋 Chi tiết các khoản chi</h2>
      <div class="table-responsive-center">
        <div class="grid-table" id="expense-grid-table">
          <div class="grid-header">
            <div>Ngày</div>
            <div>Tên</div>
            <div>Người trả</div>
            <div>Chi tiết (ai — số tiền)</div>
            <div>Tổng</div>
            <div>Hành động</div>
          </div>
          <div class="grid-body"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h2 style="margin: 0;">📊 Tổng kết công nợ</h2>
        <button onclick="clearHistory()" class="small remove">🗑️ Xóa lịch sử</button>
      </div>
      <div class="table-responsive-center">
        <div class="summary-grid" id="summary-grid-table">
          <div class="summary-header">
            <div>Tên</div>
            <div>Đã trả</div>
            <div>Cần trả</div>
            <div>Còn lại</div>
          </div>
          <div class="summary-body"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      © 2025 <strong>LATxBONA</strong> — Thiết kế & phát triển bởi <strong>LAT</strong><br>
      Ứng dụng: Wallet Balance — Kết hợp chia đều & tính riêng
    </div>
  </div>

  <!-- Liên kết tới file script.js -->
  <script src="./script.js"></script>
</body>
</html>
